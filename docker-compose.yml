services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Build de producción servida con nginx. Vite mete VITE_API_URL al compilar,
  # por eso va como argumento de build y no como variable de entorno.
  # Para desarrollar con recarga en caliente: cd frontend && pnpm dev
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
