server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Es una SPA: cualquier ruta que no sea un fichero la resuelve React Router.
  location / {
    try_files $uri /index.html;
  }

  # index.html no se cachea: tras un despliegue tiene que apuntar a los assets nuevos.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Los ficheros de assets llevan hash en el nombre, así que se pueden cachear sin miedo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
